version: "3.9"

# ══════════════════════════════════════════════════════════
#  MALTG Architecture Validator — Docker Compose
#  ► Edita ./storage/data/MALTG_ontology.owl       → Tab Ontología se actualiza en 5s
#  ► Edita ./storage/data/sdt/SDT_Synthetic.json   → Tab Gemelo Digital / Validación
#  ► Coloca .json en ./storage/data/sdt/ o ./storage/digitalShadow/ → aparecen en el
#    selector del tab "05 Digital Shadow Maturity"
#  ► El botón "Get" de "04 Get Digital Shadow" persiste sus resultados
#    (scraping + DS_<dominio>_<fecha>.json) en ./storage/digitalShadow/
# ══════════════════════════════════════════════════════════

services:

  maltg:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maltg-v2-validator
    ports:
      - "8080:8080"
    volumes:
      # Data files mounted as volumes (lectura/escritura: el backend persiste cambios de score)
      - ./storage/data:/data
      # Resultados de "04 Get Digital Shadow" / "05 Digital Shadow Maturity":
      # scraping (snapshots+manifest+PROTOCOLO.md) y los DS_<dominio>_<fecha>.json generados
      - ./storage/digitalShadow:/digitalShadow
      # Flujos BPMN de procedimientos COGEP (tab "06 Workflow")
      - ./storage/workflow:/workflow
      # Frontend mounted too → edit HTML without rebuild
      - ./frontend:/frontend:ro
      # Backend mounted too → edit main.py without rebuild (uvicorn --reload)
      - ./backend/main.py:/app/main.py:ro
    # Override image CMD to enable hot-reload on backend edits
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DASHBOARD_STYLE=glassmorphism
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.maltg.version=2.5.0"
      - "com.maltg.description=MALTG Architecture Validator"
      - "com.maltg.owl=MALTG_onto.owl"
      - "com.maltg.dt=dt_arch.json"
      - "com.maltg.ui=glassmorphism"
      - "com.maltg.fonts=Outfit+Space+Grotesk+DM+Mono"

networks:
  default:
    name: maltg-net
    driver: bridge
